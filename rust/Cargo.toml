[workspace]
resolver = "3"
members = ["crates/raad", "crates/raad-codegen", "crates/raad-macros", "crates/raad-models"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ndaskalovic/option-pricing-risk-vol"
rust-version = "1.89"

[workspace.dependencies]
raad-codegen = { path = "crates/raad-codegen", version = "0.1.0" }
raad-macros = { path = "crates/raad-macros", version = "0.1.0" }

[profile.test]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1
