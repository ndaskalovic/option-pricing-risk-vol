[package]
name = "raads"
description = "Compile-time adjoint algorithmic differentiation for option pricing: Monte Carlo and finite-difference Greeks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/raads"

[dependencies]
raads-codegen.workspace = true
raads-macros.workspace = true

[dev-dependencies]
rand = "0.9"
trybuild = "1"

[package.metadata.docs.rs]
# document the AVX2 packs (docs.rs builds for baseline x86_64 otherwise)
rustc-args = ["-C", "target-cpu=x86-64-v3"]
